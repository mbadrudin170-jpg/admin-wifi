name: Build Android Development

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Prebuild Android (CNG)
        run: bunx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          NODE_ENV: development

      - name: Locate APK
        run: find android/app/build/outputs -name "*.apk" -type f 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-development-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
